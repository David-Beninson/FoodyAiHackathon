<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .logo-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 96px;
        letter-spacing: -2px;
      }
    </style>
  </defs>
  <!-- Background to ensure visibility on both light and dark browser themes -->
  <rect width="512" height="512" rx="128" fill="#12141a" />
  
  <!-- Logo text centered -->
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" class="logo-text">
    <tspan fill="#f8fafc">Foody</tspan><tspan fill="#38cce0">AI</tspan>
  </text>
</svg>